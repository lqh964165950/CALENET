# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
 
# Parameters
nc: 2  # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors: 3  # AutoAnchor evolves 3 anchors per P output layer
 
# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2 
   [-1, 3, C3, [64]], # 1-P1/2 320*320*64
   [-1, 1, PEM, [64]],

   [-2, 1, Conv, [128, 3, 2]],  # 3-P2/4 160*160*128
   [-1, 6, C3, [128]],
   [-1, 1, PEM, [128]],

   [-2, 1, Conv, [256, 3, 2]],  # 6-P3/8 80*80*256
   [-1, 9, C3, [256]],
   [-1, 1, PEM, [256]],

   [-2, 1, Conv, [512, 3, 2]],  # 9-P4/16 40*40*512
   [-1, 3, C3, [512]],
   [-1, 1, SPPF, [512, 5]],  # 12 40*40*512
   [-1, 1, PEM, [512]],
  ]
 
# YOLOv5 v6.0 head with (P2, P3, P4) outputs
head:
  [[-1, 1, Conv, [256, 1, 1]], #13 40*40*256
   [-1, 1, nn.ConvTranspose2d, [256, 2, 2, 0, 0, 256]], #14 80*80*256
   [ 8, 1, Conv, [128, 1,1]],  #15 80*80*128
   [ 5, 1, Conv, [64, 1,1]],  #16 160*160*64
   [-1, 1, Conv, [64, 3,2]],  #17 80*80*64
   [[14, 15, 17], 1, Concat, [1]],  #18 cat backbone P4  #14 80*80*(256+128+64)

   [-1, 1, Conv, [256, 1,1]],    # 15 80*80*256
   [-1, 3, C3  , [256, False]],  # 16 80*80*256 M3
   [-1, 1, Conv, [128, 1, 1]],   # 17 80*80*128
   [-1, 1, nn.ConvTranspose2d, [128, 2, 2, 0, 0, 128]], #18 160*160*128
   [ 5, 1, Conv, [ 64, 1,1 ] ],  #19 160*160*64
   [ 2, 1, Conv, [ 32, 1,1] ],   #20 320*320*32
   [-1, 1, Conv, [ 32, 3,2 ] ],   #21 160*160*32
   [[22, 23, 25], 1, Concat, [1]],  #22  cat backbone P3 160*160*(128+64+32)
   
   [-1, 1, Conv, [128, 1,1]],    #23 160*160*128
   [-1, 3, C3  , [128, False]],  #24 out 160*160*128 M2
   [-1, 1, Conv, [64, 1, 1]],   # 25 160*160*64
   [2, 1, Conv, [ 64, 3,2 ] ], #26 160*160*64
   [[-1, -2], 1, Concat, [1]], # 27 160*160*(64+64)
   [-1, 3, C3  , [128, False]], #28 160*160*128


   [-1, 1, Conv, [64, 3, 2]],   #29 80*80*64
   [29, 1, Conv, [64, 3, 2]],   #30 80*80*64
   [[-1, 21,-2], 1, Concat, [1]],   #31  cat head P4 80*80*(128+64+64)
   [-1, 3, C3  , [256, False]],  #32 out (P4/16-medium) 80*80*256

   [-1, 1, Conv, [128, 3, 2]],   #33 40*40*128
   [21, 1, Conv, [128, 3, 2]],   #34 40*40*128
   [[-1, 13,-2], 1, Concat, [1]],   #35 cat head P5  40*40*(256+128+128)
   [-1, 3, C3  , [512, False]], # 36 (P5/32-large) 40*40*512

   [[32, 36, 40], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4)
  ]